<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f18">
<title>EsKero Controller HUD - Example</title>
<style>
    :root {
        --bg-color: #05080f;
        --panel-bg: #0d1421;
        --neon-blue: #00e5ff;
        --neon-blue-dim: rgba(0, 229, 255, 0.2);
        --neon-red: #ff0033;
        --text-main: #ffffff;
        --text-muted: #8ba0b5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; }
    
    .app { width: 100%; height: 100%; padding: env(safe-area-inset-top, 15px) 15px 15px 15px; display: flex; flex-direction: column; gap: 12px; background: radial-gradient(circle at center, #0f182a 0%, #05080f 100%); overflow-y: auto; }

    .hud-panel {
        background: var(--panel-bg);
        border: 1px solid var(--neon-blue-dim);
        border-radius: 8px;
        position: relative;
        box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.05), 0 4px 10px rgba(0,0,0,0.5);
    }
    .hud-panel::before {
        content: ''; position: absolute; top: -1px; left: -1px; width: 20px; height: 20px;
        border-top: 2px solid var(--neon-blue); border-left: 2px solid var(--neon-blue); border-radius: 8px 0 0 0;
    }
    .hud-panel::after {
        content: ''; position: absolute; bottom: -1px; right: -1px; width: 20px; height: 20px;
        border-bottom: 2px solid var(--neon-blue); border-right: 2px solid var(--neon-blue); border-radius: 0 0 8px 0;
    }

    .top { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; font-weight: 900; letter-spacing: 2px; }
    .top-title { font-size: 16px; font-style: italic; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
    
    .top-gauges { display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 10px; align-items: center; }
    
    .gps-box, .rpm-box {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 15px 5px; height: 120px;
    }
    
    .gps-label { font-size: 11px; color: var(--neon-blue); font-weight: 800; margin-bottom: 5px; text-transform: uppercase;}
    .gps-val { font-size: 32px; font-weight: 900; line-height: 1; text-shadow: 0 0 10px var(--neon-blue-dim); }
    .gps-unit { font-size: 10px; color: var(--text-muted); font-weight: 700; margin-top: 2px; }

    .rpm-val { font-size: 32px; font-weight: 900; line-height: 1; text-shadow: 0 0 10px var(--neon-blue-dim); }
    .rpm-bar-container { display: flex; gap: 2px; margin-top: 8px; width: 80%; height: 15px; }
    .rpm-segment { flex: 1; background: #1a2536; border-radius: 2px; }
    .rpm-segment.active { background: var(--neon-blue); box-shadow: 0 0 8px var(--neon-blue); }
    .rpm-segment.redline.active { background: var(--neon-red); box-shadow: 0 0 8px var(--neon-red); }

    .center-speed { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 230px; }
    .speed-ring { position: absolute; top: 0; width: 140px; height: 140px; border-radius: 50%; background: conic-gradient(var(--neon-blue) 0%, #1a2536 0%); mask: radial-gradient(transparent 65%, black 66%); -webkit-mask: radial-gradient(transparent 65%, black 66%); transition: background 0.2s; }
    
    .speed-content { height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; }
    .speed-val { font-size: 45px; font-weight: 900; line-height: 1; text-shadow: 0 0 20px rgba(0, 229, 255, 0.4); }
    .speed-unit { font-size: 12px; color: var(--neon-blue); letter-spacing: 3px; font-weight: 800; margin-top: 2px; }
    
    .odo-trip-row { display: flex; flex-direction: column; gap: 4px; font-size: 10px; font-weight: 700; color: var(--text-muted); z-index: 2; background: #000; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--neon-blue-dim); align-items: center; margin-top: 15px; }
    .odo-trip-row span { color: var(--neon-blue); font-size: 12px; }
    
    .status-indicators { display: flex; gap: 6px; z-index: 2; margin-top: 8px; }
    .status-icon, .gear-btn {
        font-size: 9px; font-weight: 900; color: #4a4a4c; 
        background: rgba(0,0,0,0.5); border: 1px solid #2a2a2c;
        padding: 2px 6px; border-radius: 4px; transition: all 0.2s;
    }
    .status-icon.active { background: rgba(255,0,51,0.2); border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 8px var(--neon-red); }
    .status-icon.kick.active { background: rgba(245,158,11,0.2); border-color: #f59e0b; color: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
    .gear-btn.active { background: rgba(0,229,255,0.2); border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 8px var(--neon-blue); }

    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stat-card { padding: 12px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
    .stat-header { font-size: 9px; color: var(--text-muted); font-weight: 800; letter-spacing: 1px; text-align: center; white-space: nowrap;}
    
    .stat-value { font-size: 20px; font-weight: 900; color: var(--neon-blue); text-shadow: 0 0 10px rgba(0,229,255,0.6); line-height: 1;}
    .stat-value span { font-size: 11px; color: var(--text-muted); margin-left: 1px; text-shadow: none; font-weight: 700;}
    
    .throttle-panel { padding: 10px 15px; }
    .thr-header { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); font-weight: 800; margin-bottom: 6px; letter-spacing: 1px; }
    .thr-val { color: var(--neon-blue); font-size: 12px; }
    .thr-bg { height: 8px; background: #1a2536; border-radius: 4px; overflow: hidden; border: 1px solid #2a3b54; }
    .thr-fill { height: 100%; background: linear-gradient(90deg, #0055ff, var(--neon-blue)); width: 0%; transition: width 0.1s; box-shadow: 0 0 10px var(--neon-blue); }

    .fab-group { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 10px; align-items: flex-end;}
    .conn-btn {
        background: var(--panel-bg); border: 1.5px solid var(--neon-red); color: #fff;
        padding: 12px 20px; border-radius: 25px; font-weight: 900; font-size: 13px;
        box-shadow: 0 0 15px rgba(255, 0, 51, 0.4); cursor: pointer; animation: pulse-red 2s infinite; width: 100%; justify-content: center;
    }
    .conn-btn.connected { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); animation: none; }
    
    @keyframes pulse-red { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<div class="app">
    <div class="top hud-panel">
        <div class="top-title">EsKero Controller HUD</div>
        <div id="connStatus" style="font-size: 12px; color: var(--neon-red); font-weight: 900;">DISCONNECTED</div>
    </div>

    <div class="top-gauges">
        <div class="gps-box hud-panel">
            <div class="gps-label">GPS SPEED</div>
            <div class="gps-val" id="gpsSpeed">0</div>
            <div class="gps-unit">KM/H</div>
        </div>

        <div class="center-speed">
            <div class="speed-ring" id="speedRing"></div>
            <div class="speed-content">
                <div class="speed-val" id="speed">0</div>
                <div class="speed-unit">KM/H</div>
            </div>
            
            <div class="odo-trip-row">
                <div>ODO <span id="odo">0.0</span> km</div>
                <div style="margin-top: 2px;">TRIP <span id="trip">0.0</span> km</div>
            </div>

            <div class="status-indicators">
                <div id="iconP" class="status-icon">P</div>
                <div id="iconKick" class="status-icon kick">KICK</div>
                <div id="gear1" class="gear-btn">1</div>
                <div id="gear2" class="gear-btn">2</div>
                <div id="gear3" class="gear-btn">3</div>
            </div>
        </div>

        <div class="rpm-box hud-panel">
            <div class="gps-label" style="color:var(--text-muted)">RPM</div>
            <div class="rpm-val" id="rpmVal">0</div>
            <div class="rpm-bar-container">
                <div class="rpm-segment"></div><div class="rpm-segment"></div><div class="rpm-segment"></div>
                <div class="rpm-segment"></div><div class="rpm-segment"></div><div class="rpm-segment"></div>
                <div class="rpm-segment"></div><div class="rpm-segment"></div><div class="rpm-segment redline"></div>
                <div class="rpm-segment redline"></div>
            </div>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card hud-panel">
            <div class="stat-header">VOLT</div>
            <div class="stat-value"><span id="volt">--</span><span>V</span></div>
        </div>
        <div class="stat-card hud-panel">
            <div class="stat-header">CURR</div>
            <div class="stat-value"><span id="amp">--</span><span>A</span></div>
        </div>
        <div class="stat-card hud-panel">
            <div class="stat-header">POWER</div>
            <div class="stat-value"><span id="power">--</span><span>W</span></div>
        </div>
        <div class="stat-card hud-panel">
            <div class="stat-header">TEMP</div>
            <div class="stat-value"><span id="ctrlTemp">--</span><span>°C</span></div>
        </div>
    </div>

    <div class="throttle-panel hud-panel">
        <div class="thr-header">
            <span>THROTTLE</span>
            <span class="thr-val" id="thrVal">0%</span>
            <span>MAX</span>
        </div>
        <div class="thr-bg"><div class="thr-fill" id="thrFill"></div></div>
    </div>
</div>

<div class="fab-group">
    <button id="connectBtn" class="conn-btn" onclick="connectController()">CONNECT SP-BLE</button>
</div>

<script>
    // ==== WEB BLUETOOTH CLIENT LOGIC ====
    const CTRL_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const CTRL_TX      = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    let ctrlDevice;
    let ctrlBuffer = new Uint8Array(0);
    
    // State
    let displaySpeedKmh = 0;
    const RPM_PER_KMH = 14.75; 

    async function connectController() {
        const btn = document.getElementById('connectBtn');
        
        if (ctrlDevice && ctrlDevice.gatt.connected) {
            ctrlDevice.gatt.disconnect();
            return;
        }

        try {
            btn.textContent = "SCANNING...";
            ctrlDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'SP-BLE' }],
                optionalServices: [CTRL_SERVICE]
            });

            ctrlDevice.addEventListener('gattserverdisconnected', onDisconnected);

            const server = await ctrlDevice.gatt.connect();
            const service = await server.getPrimaryService(CTRL_SERVICE);
            const txChar = await service.getCharacteristic(CTRL_TX);

            await txChar.startNotifications();
            txChar.addEventListener('characteristicvaluechanged', handleCtrlData);

            btn.textContent = "DISCONNECT";
            btn.classList.add('connected');
            document.getElementById('connStatus').textContent = "CONNECTED";
            document.getElementById('connStatus').style.color = "var(--neon-blue)";

        } catch (error) {
            console.error("Connection failed:", error);
            btn.textContent = "CONNECT SP-BLE";
        }
    }

    function handleCtrlData(event) {
        const dv = event.target.value;
        const chunk = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
        
        // Gabungkan ke buffer
        const newBuffer = new Uint8Array(ctrlBuffer.length + chunk.length);
        newBuffer.set(ctrlBuffer);
        newBuffer.set(chunk, ctrlBuffer.length);
        ctrlBuffer = newBuffer;

        if (ctrlBuffer.length > 8192) { ctrlBuffer = new Uint8Array(0); return; }

        let str = new TextDecoder().decode(ctrlBuffer);
        let jsonStart = str.indexOf('{');
        let jsonEnd = str.lastIndexOf('}');

        if (jsonStart !== -1 && jsonEnd !== -1 && jsonEnd > jsonStart) {
            let jsonStr = str.substring(jsonStart, jsonEnd + 1);
            try {
                let data = JSON.parse(jsonStr);
                ctrlBuffer = new Uint8Array(0); // Reset buffer
                
                updateUI(data);
                
            } catch (e) {
                // JSON tidak valid
            }
        }
    }

    function updateUI(data) {
        // 1. Speed & RPM
        let rawSpeed = Math.abs(data.r || 0) / RPM_PER_KMH;
        // EWMA Smoothing
        const alpha = rawSpeed > displaySpeedKmh ? 0.2 : 0.5;
        displaySpeedKmh = (displaySpeedKmh * (1 - alpha)) + (rawSpeed * alpha);
        if (Math.abs(rawSpeed - displaySpeedKmh) > 20) displaySpeedKmh = rawSpeed;

        document.getElementById('speed').textContent = Math.round(displaySpeedKmh);
        document.getElementById('rpmVal').textContent = Math.round(data.r || 0);

        let speedPct = Math.min(displaySpeedKmh / 120, 1) * 100;
        document.getElementById('speedRing').style.background = `conic-gradient(var(--neon-blue) ${speedPct}%, #1a2536 ${speedPct}%)`;

        let rpmPct = Math.min(Math.abs(data.r || 0) / 1300, 1) * 100;
        let activeSegments = Math.round(rpmPct / 10);
        document.querySelectorAll('.rpm-segment').forEach((seg, idx) => {
            if (idx < activeSegments) seg.classList.add('active');
            else seg.classList.remove('active');
        });

        // 2. Telemetri
        document.getElementById('volt').textContent = (data.v || 0).toFixed(1);
        document.getElementById('amp').textContent = Math.round(data.a || 0);
        document.getElementById('power').textContent = Math.round((data.v || 0) * (data.a || 0));
        document.getElementById('ctrlTemp').textContent = data.tempCtrl || '--';

        // 3. Throttle (Mapping dari voltage ke persen)
        let THR_MIN = 0.83; let THR_MAX = 3.60;
        let thrPct = ((data.thr - THR_MIN) / (THR_MAX - THR_MIN)) * 100;
        if (!Number.isFinite(thrPct)) thrPct = 0;
        thrPct = Math.max(0, Math.min(100, thrPct));
        document.getElementById('thrFill').style.width = thrPct + '%';
        document.getElementById('thrVal').textContent = Math.round(thrPct) + '%';

        // 4. ODO & TRIP
        if (data.odo !== undefined) document.getElementById('odo').textContent = data.odo.toFixed(1);
        if (data.trip !== undefined) document.getElementById('trip').textContent = data.trip.toFixed(1);

        // 5. Indikator P, KICK, Gear
        document.getElementById('iconP').className = data.p ? 'status-icon active' : 'status-icon';
        document.getElementById('iconKick').className = data.stand ? 'status-icon kick active' : 'status-icon kick';
        document.getElementById('gear1').className = (data.g === 1) ? 'gear-btn active' : 'gear-btn';
        document.getElementById('gear2').className = (data.g === 2) ? 'gear-btn active' : 'gear-btn';
        document.getElementById('gear3').className = (data.g === 3) ? 'gear-btn active' : 'gear-btn';
    }

    function onDisconnected() {
        document.getElementById('connectBtn').textContent = "CONNECT SP-BLE";
        document.getElementById('connectBtn').classList.remove('connected');
        document.getElementById('connStatus').textContent = "DISCONNECTED";
        document.getElementById('connStatus').style.color = "var(--neon-red)";
        
        ctrlBuffer = new Uint8Array(0);
        displaySpeedKmh = 0;
        document.getElementById('speed').textContent = '0';
        document.getElementById('rpmVal').textContent = '0';
        document.getElementById('volt').textContent = '--';
        document.getElementById('amp').textContent = '--';
        document.getElementById('power').textContent = '--';
        document.getElementById('ctrlTemp').textContent = '--';
        document.getElementById('thrFill').style.width = '0%';
        document.getElementById('thrVal').textContent = '0%';
    }

    // ==== GPS LOGIC (Opsional) ====
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition((pos) => {
            if (pos.coords.speed) document.getElementById('gpsSpeed').textContent = Math.round(pos.coords.speed * 3.6);
            else document.getElementById('gpsSpeed').textContent = '0';
        }, null, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
    }
</script>
</body>
</html>
